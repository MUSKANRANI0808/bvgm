name: school_app
description: A premium school management app
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 🔥 FIREBASE (ALL COMPATIBLE)
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10
  firebase_messaging: ^15.0.0

  # 📦 OTHER
  image_picker: ^1.0.4
  table_calendar: ^3.0.9
  file_picker: ^8.0.0
  open_file: ^3.3.2
  flutter_cache_manager: ^3.3.1
  pdf: ^3.10.4
  printing: ^5.12.0
  url_launcher: ^6.2.5
  excel: ^2.1.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.3
  mailer: ^6.1.0
  http: ^1.2.1
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/slider1.png
    - assets/slider2.png
    - assets/slider3.jpeg
    - assets/frame_wreath.png
    - assets/school_animation.json
    - assets/student_peeking.png
    - assets/peeking_boy_animation.json
