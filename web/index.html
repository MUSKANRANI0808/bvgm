<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Bal Vikash Gyan Mandir School Portal">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BVGM School">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Bal Vikash Gyan Mandir</title>
  <link rel="manifest" href="manifest.json">
  <script src="flutter.js" defer></script>
</head>
<body style="overflow: hidden; margin: 0; padding: 0; background-color: #F8FAFC;">
  <div id="loading" style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; color: #0B3C91; font-family: system-ui, -apple-system, sans-serif;">
    <div style="font-size: 24px; font-weight: bold; margin-bottom: 12px;">BAL VIKASH GYAN MANDIR</div>
    <div style="font-size: 14px; color: #64748B;">Loading Application...</div>
  </div>
  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.load({
        onEntrypointLoaded: async function(engineInitializer) {
          const appRunner = await engineInitializer.initializeEngine();
          await appRunner.runApp();
        }
      });
    });
  </script>
</body>
</html>
